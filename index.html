<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>Zenitsu Canvas</title>

  <!-- Fabric -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"
  ></script>

  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
  >
<link rel="stylesheet" href="css/reset.css">

  <!-- Zenitsu CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/menu.css">
</head>

<body>

  <main id="app">
<!-- Floating Dynamic Island Chip -->
<div class="zenitsu-chip-container">
  <div id="zenitsu-chip" class="zenitsu-chip" role="button" tabindex="0">
    <!-- State Kecil -->
    <span class="chip-collapsed-text">Zenitsu</span>

    <!-- State Besar -->
    <div class="chip-expanded-content">
      <div class="chip-title">
        Zenitsu <span class="chip-author">• Created by Guntur Hidayat</span>
      </div>
      <p class="chip-description">
        Designed as a lightweight and fast editor for crafting memes, mini posters, and other simple layout tasks.
      </p>
    </div>
  </div>
</div>

    <!-- Canvas -->

    <section
      class="canvas-workspace"
      aria-label="Canvas"
    >
      <canvas id="zenitsu-canvas"></canvas>
    </section>


    <!-- Bottom Sheet -->

    <footer
      id="bottom-sheet"
      class="bottom-sheet"
    >

      <!-- Drag Handle -->

      <div
        id="sheet-drag-area"
        class="sheet-drag-area"
        aria-label="Geser menu"
      >
        <div class="sheet-drag-handle"></div>
      </div>


      <!-- Navigation -->

      <header class="sheet-header">

        <nav
          id="navigation-view"
          aria-label="Navigation"
        ></nav>

        <button
          id="navigation-back"
          class="navigation-back disabled"
          type="button"
          aria-label="Kembali"
        >
          <span class="material-symbols-rounded">
            arrow_back
          </span>
        </button>

      </header>


      <!-- Menu -->

      <div id="toolbar-root"></div>

    </footer>

  </main>


  <!-- =====================================================
       ZENITSU CORE
       ===================================================== -->

  <script src="lib/zenitsu-core.js"></script>


  <!-- =====================================================
       MENUS
       ===================================================== -->

  <script src="lib/menu/MainMenu.js"></script>

  <script src="lib/menu/TextSubMenu.js"></script>
  <script src="lib/menu/EditTextMenu.js"></script>
  <script src="lib/menu/FontListSubMenu.js"></script>

  <script src="lib/menu/ShapeSubMenu.js"></script>
  <script src="lib/menu/ShapeEditMenu.js"></script>

  <script src="lib/menu/PageSubMenu.js"></script>

  <script src="lib/menu/ImageSubMenu.js"></script>
  <script src="lib/menu/ImageEditMenu.js"></script>

  <script src="lib/menu/SaveMenu.js"></script>


  <!-- =====================================================
       APP
       ===================================================== -->

  <script>
    (() => {
      const $ = selector =>
        document.querySelector(selector);


      const workspace =
        $(".canvas-workspace");

      const toolbar =
        $("#toolbar-root");

      const navigation =
        $("#navigation-view");

      const back =
        $("#navigation-back");

      const sheet =
        $("#bottom-sheet");

      const dragArea =
        $("#sheet-drag-area");


      const ROOT = "main";

      let pointerStart = null;


      /* ===================================================
         CANVAS DISPLAY
         =================================================== */

      function resizeCanvas() {
        const canvas =
          Zenitsu.getCanvas();

        if (!canvas) return;

        const availableWidth =
          Math.max(
            100,
            workspace.clientWidth - 32
          );

        const availableHeight =
          Math.max(
            100,
            workspace.clientHeight - 32
          );

        const width =
          Math.min(
            availableWidth,
            900
          );

        const height =
          Math.min(
            availableHeight,
            600
          );

        canvas.setDimensions({
          width,
          height
        });

        canvas.renderAll();
      }


      /* ===================================================
         NAVIGATION
         =================================================== */

      function renderNavigation() {
        const path =
          Zenitsu.getNavigationPath();

        navigation.innerHTML =
          path
            .map((id, index) => `
              <button
                type="button"
                data-index="${index}"
              >
                ${id}
              </button>

              ${
                index < path.length - 1
                  ? `
                    <span
                      class="navigation-separator"
                      aria-hidden="true"
                    >
                      ›
                    </span>
                  `
                  : ""
              }
            `)
            .join("");


        back.classList.toggle(
          "disabled",
          !Zenitsu.canGoBack()
        );
      }


      function resetToMain() {
        if (
          Zenitsu.getCurrentMenu() !== ROOT
        ) {
          Zenitsu.resetNavigation(ROOT);
        }
      }


      /* ===================================================
         ZENITSU
         =================================================== */

      Zenitsu.init(
        "zenitsu-canvas",
        {
          width: 800,
          height: 600,
          backgroundColor: "#fff",
          preserveObjectStacking: true
        }
      );


      Zenitsu.setMenuContainer(
        toolbar
      );


      /* ===================================================
         NAVIGATION EVENTS
         =================================================== */

      Zenitsu.on(
        "navigation:changed",
        renderNavigation
      );

      Zenitsu.on(
        "navigation:back",
        renderNavigation
      );

      Zenitsu.on(
        "navigation:reset",
        renderNavigation
      );


      /* ===================================================
         BACK
         =================================================== */

      back.addEventListener(
        "click",
        () => {
          Zenitsu.back();
        }
      );


      /* ===================================================
         BREADCRUMB
         =================================================== */

      navigation.addEventListener(
        "click",
        event => {
          const button =
            event.target.closest(
              "[data-index]"
            );

          if (!button) return;

          const target =
            Number(
              button.dataset.index
            );

          while (
            Zenitsu
              .getNavigationHistory()
              .length > target
          ) {
            if (!Zenitsu.back()) {
              break;
            }
          }
        }
      );


      /* ===================================================
         CANVAS TAP
         =================================================== */

      Zenitsu.on(
        "canvas:mousedown",
        event => {
          pointerStart = {
            x:
              event.e?.clientX ?? 0,

            y:
              event.e?.clientY ?? 0,

            target:
              event.target
          };
        }
      );


      Zenitsu.on(
        "canvas:mouseup",
        event => {
          if (!pointerStart) {
            return;
          }

          const x =
            event.e?.clientX ?? 0;

          const y =
            event.e?.clientY ?? 0;

          const moved =
            Math.hypot(
              x - pointerStart.x,
              y - pointerStart.y
            ) > 8;

          const target =
            pointerStart.target ||
            event.target;

          if (
            !moved &&
            !target
          ) {
            resetToMain();
          }

          pointerStart = null;
        }
      );

/* ===================================================
   SHEET DRAG (GPU ACCELERATED)
   =================================================== */

let dragging = false;
let startY = 0;
let currentTranslateY = 0;
let dragTranslateY = 0;
let rafId = null;

// Hitung jarak geser (misal: selisih max height dan min height)
function getMinY() {
  return 0; // Posisi terbuka penuh (Expanded)
}

function getMaxY() {
  const max = window.innerHeight * 0.30; // 30vh
  const min = 64; // min height
  return max - min; // Posisi tertutup/collapsed
}

function updateSheetPosition() {
  // Gunakan translate3d agar diproses hardware/GPU
  sheet.style.transform = `translate3d(0, ${dragTranslateY}px, 0)`;
  rafId = null;
}

dragArea.addEventListener("pointerdown", event => {
  dragging = true;
  startY = event.clientY;

  // Matikan transisi CSS saat ditarik oleh jari/mouse
  sheet.style.transition = "none";

  dragArea.setPointerCapture(event.pointerId);
});

dragArea.addEventListener("pointermove", event => {
  if (!dragging) return;

  const deltaY = event.clientY - startY;
  let nextY = currentTranslateY + deltaY;

  // Limit/Clamping batas atas & bawah
  const minY = getMinY();
  const maxY = getMaxY();
  
  // Efek membal (rubber band) sedikit saat ditarik melebihi batas
  if (nextY < minY) {
    nextY = minY + (nextY - minY) * 0.2;
  } else if (nextY > maxY) {
    nextY = maxY + (nextY - maxY) * 0.2;
  }

  dragTranslateY = nextY;

  // Render via RequestAnimationFrame agar sinkron dengan Hz layar (60Hz/120Hz)
  if (!rafId) {
    rafId = requestAnimationFrame(updateSheetPosition);
  }
});

function endSheetDrag() {
  if (!dragging) return;
  dragging = false;

  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }

  // Kembalikan transisi CSS halus saat dilepas
  sheet.style.transition = "transform 220ms cubic-bezier(0.16, 1, 0.3, 1)";

  const maxY = getMaxY();

  /*
   * Snap Logic:
   * Jika ditarik lebih dari 50% ke bawah -> Snap ke Collapsed (Tutup)
   * Jika tidak -> Snap ke Expanded (Buka)
   */
  if (dragTranslateY > maxY * 0.5) {
    currentTranslateY = maxY;
  } else {
    currentTranslateY = 0;
  }

  sheet.style.transform = `translate3d(0, ${currentTranslateY}px, 0)`;

  // Canvas HANYA di-resize SEKALI setelah animasi snap selesai
  setTimeout(() => {
    resizeCanvas();
  }, 220);
}

dragArea.addEventListener("pointerup", endSheetDrag);
dragArea.addEventListener("pointercancel", endSheetDrag);
/* ===================================================
   DYNAMIC ISLAND CHIP TOGGLE
   =================================================== */
const chip = document.getElementById("zenitsu-chip");

if (chip) {
  chip.addEventListener("click", (e) => {
    e.stopPropagation();
    chip.classList.toggle("expanded");
  });

  // Tutup kembali jika mengklik area luar (misal canvas)
  document.addEventListener("click", (e) => {
    if (!chip.contains(e.target) && chip.classList.contains("expanded")) {
      chip.classList.remove("expanded");
    }
  });
}


      /* ===================================================
         RESPONSIVE
         =================================================== */

      window.addEventListener(
        "resize",
        () => {
          const max =
            getMaxSheetHeight();

          const current =
            getSheetHeight();

          if (current > max) {
            setSheetHeight(max);
          }

          resizeCanvas();
        }
      );


      /* ===================================================
         KEYBOARD
         =================================================== */

      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Escape" &&
            Zenitsu.canGoBack()
          ) {
            Zenitsu.back();
          }
        }
      );


      /* ===================================================
         START
         =================================================== */

      resizeCanvas();

      Zenitsu.resetNavigation(
        ROOT
      );

    })();
  </script>

</body>
</html>
