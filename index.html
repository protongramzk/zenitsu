<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>Zenitsu Canvas</title>

  <!-- Fabric -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"
  ></script>

  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
  >

  <!-- Zenitsu CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/menu.css">
</head>

<body>

  <main id="app">

    <!-- Canvas -->

    <section
      class="canvas-workspace"
      aria-label="Canvas"
    >
      <canvas id="zenitsu-canvas"></canvas>
    </section>


    <!-- Bottom Sheet -->

    <footer
      id="bottom-sheet"
      class="bottom-sheet"
    >

      <!-- Drag Handle -->

      <div
        id="sheet-drag-area"
        class="sheet-drag-area"
        aria-label="Geser menu"
      >
        <div class="sheet-drag-handle"></div>
      </div>


      <!-- Navigation -->

      <header class="sheet-header">

        <nav
          id="navigation-view"
          aria-label="Navigation"
        ></nav>

        <button
          id="navigation-back"
          class="navigation-back disabled"
          type="button"
          aria-label="Kembali"
        >
          <span class="material-symbols-rounded">
            arrow_back
          </span>
        </button>

      </header>


      <!-- Menu -->

      <div id="toolbar-root"></div>

    </footer>

  </main>


  <!-- =====================================================
       ZENITSU CORE
       ===================================================== -->

  <script src="lib/zenitsu-core.js"></script>


  <!-- =====================================================
       MENUS
       ===================================================== -->

  <script src="lib/menu/MainMenu.js"></script>

  <script src="lib/menu/TextSubMenu.js"></script>
  <script src="lib/menu/EditTextMenu.js"></script>
  <script src="lib/menu/FontListSubMenu.js"></script>

  <script src="lib/menu/ShapeSubMenu.js"></script>
  <script src="lib/menu/ShapeEditMenu.js"></script>

  <script src="lib/menu/PageSubMenu.js"></script>

  <script src="lib/menu/ImageSubMenu.js"></script>
  <script src="lib/menu/ImageEditMenu.js"></script>

  <script src="lib/menu/SaveMenu.js"></script>


  <!-- =====================================================
       APP
       ===================================================== -->

  <script>
    (() => {
      const $ = selector =>
        document.querySelector(selector);


      const workspace =
        $(".canvas-workspace");

      const toolbar =
        $("#toolbar-root");

      const navigation =
        $("#navigation-view");

      const back =
        $("#navigation-back");

      const sheet =
        $("#bottom-sheet");

      const dragArea =
        $("#sheet-drag-area");


      const ROOT = "main";

      let pointerStart = null;


      /* ===================================================
         CANVAS DISPLAY
         =================================================== */

      function resizeCanvas() {
        const canvas =
          Zenitsu.getCanvas();

        if (!canvas) return;

        const availableWidth =
          Math.max(
            100,
            workspace.clientWidth - 32
          );

        const availableHeight =
          Math.max(
            100,
            workspace.clientHeight - 32
          );

        const width =
          Math.min(
            availableWidth,
            900
          );

        const height =
          Math.min(
            availableHeight,
            600
          );

        canvas.setDimensions({
          width,
          height
        });

        canvas.renderAll();
      }


      /* ===================================================
         NAVIGATION
         =================================================== */

      function renderNavigation() {
        const path =
          Zenitsu.getNavigationPath();

        navigation.innerHTML =
          path
            .map((id, index) => `
              <button
                type="button"
                data-index="${index}"
              >
                ${id}
              </button>

              ${
                index < path.length - 1
                  ? `
                    <span
                      class="navigation-separator"
                      aria-hidden="true"
                    >
                      ›
                    </span>
                  `
                  : ""
              }
            `)
            .join("");


        back.classList.toggle(
          "disabled",
          !Zenitsu.canGoBack()
        );
      }


      function resetToMain() {
        if (
          Zenitsu.getCurrentMenu() !== ROOT
        ) {
          Zenitsu.resetNavigation(ROOT);
        }
      }


      /* ===================================================
         ZENITSU
         =================================================== */

      Zenitsu.init(
        "zenitsu-canvas",
        {
          width: 800,
          height: 600,
          backgroundColor: "#fff",
          preserveObjectStacking: true
        }
      );


      Zenitsu.setMenuContainer(
        toolbar
      );


      /* ===================================================
         NAVIGATION EVENTS
         =================================================== */

      Zenitsu.on(
        "navigation:changed",
        renderNavigation
      );

      Zenitsu.on(
        "navigation:back",
        renderNavigation
      );

      Zenitsu.on(
        "navigation:reset",
        renderNavigation
      );


      /* ===================================================
         BACK
         =================================================== */

      back.addEventListener(
        "click",
        () => {
          Zenitsu.back();
        }
      );


      /* ===================================================
         BREADCRUMB
         =================================================== */

      navigation.addEventListener(
        "click",
        event => {
          const button =
            event.target.closest(
              "[data-index]"
            );

          if (!button) return;

          const target =
            Number(
              button.dataset.index
            );

          while (
            Zenitsu
              .getNavigationHistory()
              .length > target
          ) {
            if (!Zenitsu.back()) {
              break;
            }
          }
        }
      );


      /* ===================================================
         CANVAS TAP
         =================================================== */

      Zenitsu.on(
        "canvas:mousedown",
        event => {
          pointerStart = {
            x:
              event.e?.clientX ?? 0,

            y:
              event.e?.clientY ?? 0,

            target:
              event.target
          };
        }
      );


      Zenitsu.on(
        "canvas:mouseup",
        event => {
          if (!pointerStart) {
            return;
          }

          const x =
            event.e?.clientX ?? 0;

          const y =
            event.e?.clientY ?? 0;

          const moved =
            Math.hypot(
              x - pointerStart.x,
              y - pointerStart.y
            ) > 8;

          const target =
            pointerStart.target ||
            event.target;

          if (
            !moved &&
            !target
          ) {
            resetToMain();
          }

          pointerStart = null;
        }
      );


      /* ===================================================
         SHEET DRAG
         =================================================== */

      let dragging = false;
      let dragStartY = 0;
      let startHeight = 0;


      function getMaxSheetHeight() {
        return window.innerHeight * 0.30;
      }


      function getSheetHeight() {
        return sheet.getBoundingClientRect().height;
      }


      function setSheetHeight(height) {
        const min =
          64;

        const max =
          getMaxSheetHeight();

        const next =
          Math.max(
            min,
            Math.min(
              height,
              max
            )
          );

        sheet.style.height =
          `${next}px`;

        resizeCanvas();
      }


      dragArea.addEventListener(
        "pointerdown",
        event => {
          dragging = true;

          dragStartY =
            event.clientY;

          startHeight =
            getSheetHeight();

          sheet.style.transition =
            "none";

          dragArea.setPointerCapture(
            event.pointerId
          );
        }
      );


      dragArea.addEventListener(
        "pointermove",
        event => {
          if (!dragging) return;

          const delta =
            dragStartY -
            event.clientY;

          setSheetHeight(
            startHeight + delta
          );
        }
      );


      function endSheetDrag() {
        if (!dragging) return;

        dragging = false;

        sheet.style.transition = "";

        const height =
          getSheetHeight();

        const max =
          getMaxSheetHeight();

        /*
         * Snap sederhana:
         * dekat minimum -> minimum
         * selain itu -> maksimum
         */

        if (height < max * 0.55) {
          setSheetHeight(64);
        } else {
          setSheetHeight(max);
        }
      }


      dragArea.addEventListener(
        "pointerup",
        endSheetDrag
      );

      dragArea.addEventListener(
        "pointercancel",
        endSheetDrag
      );


      /* ===================================================
         RESPONSIVE
         =================================================== */

      window.addEventListener(
        "resize",
        () => {
          const max =
            getMaxSheetHeight();

          const current =
            getSheetHeight();

          if (current > max) {
            setSheetHeight(max);
          }

          resizeCanvas();
        }
      );


      /* ===================================================
         KEYBOARD
         =================================================== */

      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Escape" &&
            Zenitsu.canGoBack()
          ) {
            Zenitsu.back();
          }
        }
      );


      /* ===================================================
         START
         =================================================== */

      resizeCanvas();

      Zenitsu.resetNavigation(
        ROOT
      );

    })();
  </script>

</body>
</html>
