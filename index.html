<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Zenitsu Canvas</title>

  <!-- Fabric -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Canvas */

    .canvas-workspace {
      flex: 1;
      min-height: 0;

      display: grid;
      place-items: center;
      overflow: hidden;

      background-image:
        radial-gradient(#444 1px, transparent 1px);
      background-size: 16px 16px;
    }

    canvas {
      display: block;
      box-shadow: 0 4px 30px #0008;
    }

    /* Bottom sheet */

    .bottom-sheet {
      flex-shrink: 0;

      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

      background: #181818;
      border-top: 1px solid #333;
    }

    /* Navigation */

    .sheet-header {
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 6px;
    }

    .navigation-view {
      min-width: 0;

      display: flex;
      align-items: center;

      overflow-x: auto;
      white-space: nowrap;

      font-size: 11px;
      color: #999;

      scrollbar-width: none;
    }

    .navigation-view::-webkit-scrollbar {
      display: none;
    }

    .navigation-view button {
      border: 0;
      padding: 0;

      background: transparent;
      color: #999;

      font: inherit;
      cursor: pointer;
    }

    .navigation-view button:last-child {
      color: #fff;
      font-weight: 600;
    }

    .navigation-separator {
      margin: 0 5px;
      color: #555;
    }

    .navigation-back {
      width: 30px;
      height: 30px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 7px;

      background: #292929;
      color: #fff;

      cursor: pointer;
    }

    .navigation-back.disabled {
      opacity: .3;
      pointer-events: none;
    }

    /* Menu */

    #toolbar-root {
      min-height: 58px;
    }

    .zenitsu-menu-level {
      display: flex;
      gap: 8px;

      overflow-x: auto;
      scrollbar-width: none;
    }

    .zenitsu-menu-level::-webkit-scrollbar {
      display: none;
    }

    .zenitsu-menu-button {
      width: 64px;
      min-width: 64px;
      height: 58px;

      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px !important;

      padding: 5px !important;

      border: 0;
      border-radius: 9px !important;

      background: transparent;
      color: #fff;

      cursor: pointer;
    }

    .zenitsu-menu-button:active {
      background: #292929;
    }

    .material-symbols-rounded {
      font-size: 22px;
      line-height: 1;
    }

    .zenitsu-menu-button span:last-child {
      font-size: 10px;
      line-height: 1;
      color: #bbb;
      white-space: nowrap;
    }
.zenitsu-save-menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 4px;
}

.save-section {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.save-title {
  font-size: 11px;
  font-weight: 600;
  color: #999;
}

.save-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.save-option,
.save-quality button,
.save-button {
  min-height: 38px;

  border: 1px solid #333;
  border-radius: 7px;

  background: #222;
  color: #fff;

  font: inherit;
  font-size: 11px;

  cursor: pointer;
}

.save-option {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.save-quality {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.save-option.active,
.save-quality button.active {
  background: #333;
  border-color: #666;
}

.save-button {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;

  background: #fff;
  color: #111;
  border-color: #fff;
}
  </style>
</head>

<body>

  <main id="app">

    <section class="canvas-workspace">
      <canvas id="zenitsu-canvas"></canvas>
    </section>

    <footer class="bottom-sheet">

      <header class="sheet-header">

        <nav
          id="navigation-view"
          aria-label="Navigation"
        ></nav>

        <button
          id="navigation-back"
          class="navigation-back disabled"
          type="button"
          aria-label="Kembali"
        >
          <span class="material-symbols-rounded">
            arrow_back
          </span>
        </button>

      </header>

      <div id="toolbar-root"></div>

    </footer>

  </main>


  <!-- Zenitsu -->
<script src="lib/zenitsu-core.js"></script>

<script src="lib/menu/MainMenu.js"></script>
<script src="lib/menu/TextSubMenu.js"></script>

<script src="lib/menu/ShapeSubMenu.js"></script>
<script src="lib/menu/PageSubMenu.js"></script>
<script src="lib/menu/EditTextMenu.js"></script>
<script src="lib/menu/ImageSubMenu.js"></script>
<script src="lib/menu/ImageEditMenu.js"></script>
<script src="lib/menu/ShapeEditMenu.js"></script>
<script src="lib/menu/FontListSubMenu.js"></script>
<script src="lib/menu/SaveMenu.js"></script>
  <script>
    const $ = s => document.querySelector(s);

    const workspace = $(".canvas-workspace");
    const toolbar = $("#toolbar-root");
    const navigation = $("#navigation-view");
    const back = $("#navigation-back");

    const ROOT = "main";

    let pointerStart = null;


    /* Canvas */

    function resizeCanvas() {
      const canvas = Zenitsu.getCanvas();

      if (!canvas) return;

      canvas.setDimensions({
        width: Math.min(
          workspace.clientWidth - 32,
          900
        ),

        height: Math.min(
          workspace.clientHeight - 32,
          600
        )
      });

      canvas.renderAll();
    }


    /* Navigation */

    function renderNavigation() {
      const path = Zenitsu.getNavigationPath();

      navigation.innerHTML = path
        .map((id, index) => `
          <button
            type="button"
            data-index="${index}"
          >
            ${id}
          </button>

          ${
            index < path.length - 1
              ? `<span class="navigation-separator">›</span>`
              : ""
          }
        `)
        .join("");

      back.classList.toggle(
        "disabled",
        !Zenitsu.canGoBack()
      );
    }


    function resetToMain() {
      if (Zenitsu.getCurrentMenu() !== ROOT) {
        Zenitsu.resetNavigation(ROOT);
      }
    }


    /* Zenitsu */

    Zenitsu.init("zenitsu-canvas", {
      width: 800,
      height: 600,
      backgroundColor: "#fff"
    });

    Zenitsu.setMenuContainer(toolbar);


    /* Navigation events */

    Zenitsu.on(
      "navigation:changed",
      renderNavigation
    );

    Zenitsu.on(
      "navigation:back",
      renderNavigation
    );

    Zenitsu.on(
      "navigation:reset",
      renderNavigation
    );


    /* Back */

    back.onclick = () => {
      Zenitsu.back();
    };


    /* Breadcrumb */

    navigation.onclick = event => {
      const button =
        event.target.closest("[data-index]");

      if (!button) return;

      const target =
        Number(button.dataset.index);

      while (
        Zenitsu.getNavigationHistory().length >
        target
      ) {
        if (!Zenitsu.back()) break;
      }
    };


    /* Canvas tap */

    Zenitsu.on(
      "canvas:mousedown",
      event => {
        pointerStart = {
          x: event.e?.clientX ?? 0,
          y: event.e?.clientY ?? 0,
          target: event.target
        };
      }
    );


    Zenitsu.on(
      "canvas:mouseup",
      event => {
        if (!pointerStart) return;

        const x =
          event.e?.clientX ?? 0;

        const y =
          event.e?.clientY ?? 0;

        const moved =
          Math.hypot(
            x - pointerStart.x,
            y - pointerStart.y
          ) > 8;

        const target =
          pointerStart.target ||
          event.target;

        if (!moved && !target) {
          resetToMain();
        }

        pointerStart = null;
      }
    );


    /* Resize */

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* Keyboard */

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Escape" &&
          Zenitsu.canGoBack()
        ) {
          Zenitsu.back();
        }
      }
    );


    /* Start */

    resizeCanvas();
    Zenitsu.resetNavigation(ROOT);
  </script>

</body>
</html>
